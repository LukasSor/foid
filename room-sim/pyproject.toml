[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foid-sim"
version = "0.1.0"
description = "Graphical room simulator for Foid"
requires-python = ">=3.11"
dependencies = [
    "foid-protocol",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.scripts]
foid-sim = "foid_sim.server:main"

[tool.setuptools.packages.find]
include = ["foid_sim*"]

[tool.setuptools.package-data]
foid_sim = ["static/**/*"]

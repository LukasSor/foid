[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foid-voice"
version = "0.1.0"
description = "Offline Jetson voice box for Foid room control"
requires-python = ">=3.11"
dependencies = [
    "foid-protocol",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "rapidfuzz>=3.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.0",
    "ctranslate2>=4.8.1",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12==9.*",
    "nvidia-nvjitlink-cu12",
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
    "silero-vad>=5.1",
]
llm = [
    "llama-cpp-python>=0.2.90",
]

[project.scripts]
foid-voice = "foid_voice.app:main"

[tool.setuptools.packages.find]
include = ["foid_voice*"]

[tool.setuptools.package-data]
foid_voice = ["templates/*", "static/**/*", "data/*"]

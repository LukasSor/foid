[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foid-protocol"
version = "0.1.0"
description = "Shared room-control catalog and JSON-over-TCP protocol for Foid"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["foid_protocol*"]

[tool.setuptools.package-data]
foid_protocol = ["devices/*.yaml"]
